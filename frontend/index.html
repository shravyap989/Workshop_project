<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canteen Ordering System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🍽️ Canteen Ordering System</h1>
    <p>Menu | Cart | Orders | Status | History</p>
  </header>

  <main>
    <section>
      <h2>Menu</h2>
      <div id="menu" class="grid"></div>
    </section>

    <section class="panel">
      <h2>Cart</h2>
      <div id="cart"></div>
      <h3>Total: ₹<span id="total">0.00</span></h3>
      <button onclick="placeOrder()">Place Order</button>
      <p id="message"></p>
    </section>

    <section>
      <h2>Order History</h2>
      <div id="orders"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
